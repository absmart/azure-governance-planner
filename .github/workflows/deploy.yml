# Test, build and deploy the app to Azure Static Web Apps (swa-azure-governance-planner)
# on every push to main. Needs the repository secret
# AZURE_STATIC_WEB_APPS_API_TOKEN: the Static Web App's deployment token.

name: Deploy

on:
  push:
    branches: [main]
  workflow_dispatch:

# One deploy at a time; a newer push cancels a deploy that hasn't finished.
concurrency:
  group: deploy-production
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm

      - run: npm ci
      - run: npm test
      - run: npm run build

      - name: Deploy to Azure Static Web Apps
        uses: Azure/static-web-apps-deploy@v1
        with:
          azure_static_web_apps_api_token: ${{ secrets.AZURE_STATIC_WEB_APPS_API_TOKEN }}
          action: upload
          # Already built above, so upload dist/ as is.
          app_location: dist
          skip_app_build: true
          api_location: ''
